[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ginn"
version = "1.0.0"
description = "Ginnungagap (ginn) is a Void Linux tool that creates isolated per-distribution Realms on rootless Podman and runs their applications as native desktop and terminal applications, without modifying the host."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Bongbetic" }]
dependencies = []

[project.optional-dependencies]
gui = ["PyGObject>=3.50"]
dev = ["pytest>=8", "pytest-cov", "hypothesis", "ruff", "mypy"]

[project.scripts]
ginn = "ginn.__main__:main"
ginn-gui = "ginn.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ginn = ["py.typed", "**/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "fr(id): SRS requirement id",
    "host_glibc",
    "host_musl",
    "host_nvidia",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["ginn"]
omit = ["src/ginn/gui/views/*"]
