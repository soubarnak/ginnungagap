# ADR-007 mitigation (a), create-time form (S-05s). spikes/s05/s05s.sh bind-mounts this file
# read-only at /etc/systemd/journald.conf.d/ginn.conf on the services-on create argv. The
# journal stays in RAM under /run and is capped at 8 MiB.
[Journal]
Storage=volatile
RuntimeMaxUse=8M
