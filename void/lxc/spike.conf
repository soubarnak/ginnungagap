# Hand-written LXC config used for the M0 spike (Ubuntu noble guest, debootstrap rootfs).
lxc.uts.name = spike
lxc.rootfs.path = dir:/var/lib/spaces-spike/rootfs
lxc.net.0.type = none
lxc.autodev = 1
lxc.tty.max = 0
lxc.pty.max = 1024
lxc.init.cmd = /usr/lib/systemd/systemd
lxc.signal.halt = SIGRTMIN+3
lxc.mount.auto = proc:mixed sys:mixed cgroup:rw:force
lxc.apparmor.profile = lxc-container-default-cgns
lxc.cgroup.dir.container = spaces-spike
lxc.cgroup.dir.monitor = spaces-spike-mon
lxc.include = /usr/share/lxc/config/common.conf
