# pacman configuration used by the Spaces pacstrap shim
# (/usr/lib/spaces/void/bin/pacstrap, installed from void/bin/pacstrap).
#
# Void's own /etc/pacman.conf stays untouched: it has no repositories and
# belongs to the Void `pacman` package. This file only serves bootstrapping
# an Arch guest from a Void host. x86_64 only; the guest gets its own
# /etc/pacman.conf from the `pacman` package pacstrap installs.
[options]
GPGDir       = /var/lib/spaces/.host/arch/gnupg
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
