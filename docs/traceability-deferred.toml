# Must FR and NFR requirements with no automated test yet, or only unit-level tests (NFR-061,
# Appendix C). Each entry names the roadmap milestone (docs/roadmap.md) that owns the proving test.
# `partial = true` marks an ID whose unit-level tests can run while its host-only or end-to-end
# acceptance proof is still deferred to that milestone. Only a partial entry may keep tests.
# tools/traceability.py --check fails when an entry lacks a milestone, names an ID that is not
# a Must FR or NFR, or has gained a test without `partial = true` (delete the entry if the tests
# prove the whole requirement).

[[deferred]]
id = "FR-001"
milestone = "M3"
partial = true
reason = "the root check, the Host Setup Record and the subid, service and link writes are unit-tested (T3.4). G1 (spikes/results/G1-host-setup-roundtrip.md, 2026-10-12) ran setup on a Void host: the record listed 11 paths and each subid file gained one line. The first ginn doctor run then had one FAIL (runsvdir): the run script waits for ~/.local/state/ginn/sv, which setup does not create, by design. Doctor now reports that idle supervisor as WARN, with mkdir -m 0700 -p as the fix (code change, not re-run on the host), so no FAIL right after setup (CL-13). Not yet observed on a host: that run, and AC-1 with the subid, record and doctor checks together"

