# Must FR and NFR requirements with no automated test yet, or only unit-level tests (NFR-061,
# Appendix C). Each entry names the roadmap milestone (docs/roadmap.md) that owns the proving test.
# `partial = true` marks an ID whose unit-level tests can run while its host-only or end-to-end
# acceptance proof is still deferred to that milestone. Only a partial entry may keep tests.
# tools/traceability.py --check fails when an entry lacks a milestone, names an ID that is not
# a Must FR or NFR, or has gained a test without `partial = true` (delete the entry if the tests
# prove the whole requirement).

