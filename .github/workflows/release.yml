name: release

# Releases are tag-driven (docs/packaging.md). Bump the version in pyproject.toml and in
# packaging/void/srcpkgs/ginn/template, commit, push, then push the tag ginn-vX.Y.Z. The tag must
# equal the source version, or the first job fails. Never build or upload release assets by hand.
on:
  push:
    tags: ["ginn-v*"]

permissions:
  contents: read

# Actions are pinned to the commit SHAs that ci.yaml uses. The comment after each SHA names the tag.

jobs:
  verify:
    name: tag equals the source version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compare the tag with pyproject.toml and the template
        run: bash tools/release.sh verify-tag "$GITHUB_REF_NAME"

  test:
    name: test (glibc)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run the suite as a non-root user in the Void container
        run: |
          sudo podman run --rm -i -v "$GITHUB_WORKSPACE:/src:ro" ghcr.io/void-linux/void-glibc-full:latest sh -s <<'CONTAINER'
          set -eu
          xbps-install -Syu -y xbps </dev/null
          xbps-install -yu </dev/null
          xbps-install -y python3 python3-pytest python3-pytest-cov python3-hypothesis python3-yaml python3-mypy python3-gobject ruff git shadow bash gcc make </dev/null
          useradd -m tester
          cp -a /src /home/tester/ginn
          chown -R tester /home/tester/ginn
          git config --system --add safe.directory /home/tester/ginn
          su -l tester -c 'cd ~/ginn && python3 -m pytest -q -rs --cov=ginn --cov-report=term-missing --cov-fail-under=80 && ruff check src tests tools && python3 -m mypy src/ginn && python3 tools/gen_errors_doc.py --check && python3 tools/traceability.py --check' </dev/null
          CONTAINER

  release:
    name: build, sign and publish
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the package in the Void container (no signing key here)
        run: |
          mkdir -p "$RUNNER_TEMP/binpkgs"
          sudo podman run --rm -i --privileged -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/binpkgs:/out" ghcr.io/void-linux/void-glibc-full:latest sh -s <<'CONTAINER'
          set -eu
          xbps-install -Syu -y xbps </dev/null
          xbps-install -yu </dev/null
          xbps-install -y git shadow bash </dev/null
          # xbps-src refuses root and builds in a chroot, so build as builder in group xbuilder,
          # as ci.yaml does. The container is privileged for the same reason.
          getent group xbuilder >/dev/null || groupadd xbuilder
          useradd -m -G xbuilder builder
          cp -a /src /home/builder/ginnungagap
          git clone --depth 1 https://github.com/void-linux/void-packages.git /home/builder/void-packages
          printf 'XBPS_CHROOT_CMD=uchroot\n' >> /home/builder/void-packages/etc/conf
          chown -R builder /home/builder/ginnungagap /home/builder/void-packages
          git config --system --add safe.directory /home/builder/ginnungagap
          git config --system --add safe.directory /home/builder/void-packages
          # GINN_LOCAL_SOURCE=1 builds the tagged commit itself, so the build needs no checksum
          # of the GitHub tag archive (the bump job writes that one after the release).
          su -l builder -c 'cd ~/ginnungagap && GINN_LOCAL_SOURCE=1 tools/xbps-build.sh ~/void-packages' </dev/null
          cp /home/builder/void-packages/hostdir/binpkgs/ginn*.xbps /out/
          CONTAINER
      - name: Write the signing key (mode 600)
        env:
          XBPS_PRIVKEY: ${{ secrets.XBPS_PRIVKEY }}
        run: |
          if [ -z "$XBPS_PRIVKEY" ]; then
              echo "the Actions secret XBPS_PRIVKEY is not set" >&2
              exit 1
          fi
          (umask 077 && printf '%s\n' "$XBPS_PRIVKEY" > "$RUNNER_TEMP/xbps-privkey.pem")
      - name: Index and sign the repository (second container, key and packages only)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          sudo podman run --rm -i -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/xbps-privkey.pem:/key.pem:ro" -v "$RUNNER_TEMP/binpkgs:/binpkgs:ro" -v "$RUNNER_TEMP/out:/out" ghcr.io/void-linux/void-glibc-full:latest sh -s <<'CONTAINER'
          set -eu
          xbps-install -Syu -y xbps </dev/null
          xbps-install -yu </dev/null
          xbps-install -y python3 bash </dev/null
          # /src is read-only and release.sh writes the traceability matrix, so work on a copy.
          cp -a /src /work
          cd /work
          GINN_SIGNING_KEY=/key.pem bash tools/release.sh repo /binpkgs /out/repo
          cp packaging/void/srcpkgs/ginn/template /out/repo/template
          CONTAINER
      - name: Remove the signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/xbps-privkey.pem"
      - name: Check the assets
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/out"
          ls -l "$RUNNER_TEMP/out/repo"
          test -s "$RUNNER_TEMP/out/repo/x86_64-repodata"
          test -n "$(ls "$RUNNER_TEMP"/out/repo/ginn-*.xbps.sig2)"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#ginn-v}
          notes="docs/release-notes/v$version.md"
          # The template in the repo still holds the checksum placeholder here. The bump job
          # uploads the real one, so it is not attached now.
          rm -f -- "$RUNNER_TEMP/out/repo/template"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" --clobber "$RUNNER_TEMP"/out/repo/*
          elif [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --verify-tag --title "ginn $version" --notes-file "$notes" "$RUNNER_TEMP"/out/repo/*
          else
              gh release create "$GITHUB_REF_NAME" --verify-tag --title "ginn $version" --generate-notes "$RUNNER_TEMP"/out/repo/*
          fi

  bump:
    name: record the checksum on the void branch
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The default branch, not the tag: the commit goes straight to void, with no pull request.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: void
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Write version and checksum into the template and the README
        run: bash tools/release.sh bump "$GITHUB_REF_NAME"
      - name: Attach the template with the real checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=packaging/void/srcpkgs/ginn/template
          if grep -q "^version=${GITHUB_REF_NAME#ginn-v}$" "$t" && grep -Eq '^checksum=[0-9a-f]{64}$' "$t"; then
              cp "$t" "$RUNNER_TEMP/template"
              gh release upload "$GITHUB_REF_NAME" --clobber "$RUNNER_TEMP/template"
          else
              echo "template not bumped for $GITHUB_REF_NAME; not attached"
          fi
      - name: Commit to void
        run: |
          if git diff --quiet; then
              echo "nothing to commit"
              exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/void/srcpkgs/ginn/template README.md
          git commit -m "T10.6: record the $GITHUB_REF_NAME checksum in the template (NFR-062, AS-003)"
          git push origin HEAD:void || { git pull --rebase origin void && git push origin HEAD:void; }
