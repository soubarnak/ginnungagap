# Test-only fake distribution (NFR-060). It is not a real distribution. Its name starts with `_`, so
# ginn hides it: available() leaves it out unless include_test=True and the test switch
# GINN_TEST_DISTROS=1 is on, and load() refuses it without the switch (loader.py). It has no table
# in src/ginn/trust/data/trust.toml. Tests load it, and load a renamed copy, to prove that a new
# distribution needs no code change.
schema = 1
id = "_test"
trust_key = "_test"
shell = "/bin/sh"
package_name_regex = '[a-z][a-z0-9.+-]{1,63}'
signature_error_regex = 'FAKE-SIGNATURE-ERROR'
stale_metadata_regex = 'FAKE-STALE-METADATA'
# FR-120: a non-zero status whose output matches this is a transient network failure, retried
# with the FR-120 delays. A signature match wins over it, and stale metadata is not a network
# failure (ADR-011). Runtime text, not verified until M4.
network_error_regex = 'FAKE-NETWORK-ERROR'
missing_package_regex = 'FAKE-MISSING-PACKAGE'
refresh_before = ["install"]

[integration]
packages = ["fake-ca", "fake-locale-{lang}"]
steps = [["fake-locale-gen", "{locale}"]]

[verbs]
refresh = ["fake-pm", "refresh"]
install = ["fake-pm", "install", "{packages}"]
# No remove-check: the fixture omits it, so the optional-verb path stays tested (ADR-011).
remove = ["fake-pm", "remove", "{packages}"]
upgrade = ["fake-pm", "upgrade"]
check-updates = [["fake-pm", "check"]]
list-explicit = ["fake-pm", "list"]
resolve = ["fake-pm", "resolve", "{packages}"]
estimate = ["fake-pm", "estimate", "{packages}"]
